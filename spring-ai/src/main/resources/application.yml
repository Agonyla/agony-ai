# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      packages-to-scan: com.agony.springai.controller
      paths-to-match:
        - "/**"
      paths-to-exclude:
        - "/chatClient/**"
        - "/prompt/**"
    - group: 'chatClient'
      packages-to-scan: com.agony.springai.controller.chatClient
    - group: 'prompt'
      packages-to-scan: com.agony.springai.controller.prompt
    - group: 'sse'
      packages-to-scan: com.agony.spirngai.controller.sse