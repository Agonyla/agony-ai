spring:
  ai:
    openai:
      # 如果用 DeepSeek，改成 https://api.deepseek.com
      # 如果用 OpenAI，改成 https://api.openai.com（或者不填，默认就是这个）
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${QWEN_API_KEY}   # 从环境变量读取，不要直接写在配置文件里
      chat:
        options:
          model: qwen3.6-plus        # DeepSeek-V3 的模型名 deepseek-chat
          temperature: 0.7

  profiles:
    active: local

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      packages-to-scan: com.agony.springai.controller
      paths-to-match:
        - "/**"
      paths-to-exclude:
        - "/chatClient/**"
        - "/prompt/**"
    - group: 'chatClient'
      packages-to-scan: com.agony.springai.controller.chatClient
    - group: 'prompt'
      packages-to-scan: com.agony.springai.controller.prompt
    - group: 'sse'
      packages-to-scan: com.agony.spirngai.controller.sse