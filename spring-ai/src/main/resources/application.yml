spring:
  ai:
    openai:
      # 如果用 DeepSeek，改成 https://api.deepseek.com
      # 如果用 OpenAI，改成 https://api.openai.com（或者不填，默认就是这个）
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${QWEN_API_KEY}   # 从环境变量读取，不要直接写在配置文件里
      chat:
        options:
          model: qwen3.6-plus        # DeepSeek-V3 的模型名 deepseek-chat
          temperature: 0.7

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/dbtest
    username: postgres
    password: 19991209
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

