# springdoc-openapi项目配置
springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      packages-to-scan: com.agony.salesAgent.controller
      paths-to-match:
        - "/**"

app:
  auth:
    enabled: false   # true=开启权限，false=开发测试时关闭