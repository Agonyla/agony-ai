server:
  port: 8081

spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}   # 从环境变量读取
      chat:
        options:
          model: qwen-plus             # 默认使用 qwen-max
          temperature: 0.7
          max-tokens: 2048

  profiles:
    active: local


# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      packages-to-scan: com.agony.springaialibaba.controller
      paths-to-match:
        - "/**"