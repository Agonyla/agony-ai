server:
  port: 8081

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  # 数据库
  datasource:
    url: jdbc:postgresql://localhost:5432/vectordb
    username: postgres
    password: 19991209

  ai:
    # 通义千问
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}   # 从环境变量读取
      embedding:
        options:
          model: text-embedding-v3  # 通义 Embedding 模型
      chat:
        options:
          model: qwen-plus             # 默认使用 qwen-max
          temperature: 0.7
          max-tokens: 2048
      retry:
        max-attempts: 20       # 默认 10，图片生成慢时不够用
        backoff:
          initial-interval: 3s # 首次轮询等待时间
          multiplier: 2        # 不要设太大，否则间隔迅速拉长
          max-interval: 15s    # 最大轮询间隔

    # PGVector
    vectorstore:
      pgvector:
        initialize-schema: false          # 自动建向量表，第一次启动后可关掉，需要先用postgre 的stackbuilder 安装vector.control。
        index-type: HNSW                 # HNSW 索引，查询速度快
        distance-type: COSINE_DISTANCE   # 余弦相似度
        dimensions: 1024                 # text-embedding-v3 的向量维度是 1024，别填错，填错了报错很难排查

    # kimi
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode  # https://api.deepseek.com
      chat:
        options:
          model: kimi-k2.6 # deepseek-chat

  # Spring MVC 请求线程自动使用虚拟线程
  threads:
    virtual:
      enabled: true

  profiles:
    active: local

# api 默认配置
app:
  ai:
    # 全局默认用哪个厂商，可选值：deepseek / qwen
    # ModelRouterService 里没有明确指定时，fallback 到这里
    default-provider: qwen
    providers:
      #      deepseek:
      #        # 调用时动态传给 ChatOptions.model()，想换推理模型只改这里
      #        # 例如：deepseek-chat → deepseek-reasoner（深度思考模式）
      #        model: deepseek-chat
      qwen:
        # 例如：qwen-plus → qwen-max（更强但更贵）
        model: qwen-plus
      kimi:
        model: kimi-k2.6


# springdoc-openapi项目配置
springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      packages-to-scan: com.agony.springaialibaba.controller
      paths-to-match:
        - "/**"

# 熔断器配置
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 10           # 统计最近 10 次调用
        failure-rate-threshold: 50        # 失败率超过 50% 触发熔断
        wait-duration-in-open-state: 30s  # 熔断后等待 30s 再尝试半开
        permitted-number-of-calls-in-half-open-state: 3  # 半开状态测试 3 次
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException